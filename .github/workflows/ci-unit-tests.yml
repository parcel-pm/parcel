name: CI Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  make-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run tests
        # Retry wrapper: the macOS 26 runner occasionally wedges one of the
        # spawned host processes mid-suite (see actions/runner-images#13882),
        # hanging the run until timeout-minutes fires. Each attempt runs the
        # full suite with a 4-minute ceiling; a fresh attempt gets a fresh
        # process tree, so a wedged attempt cannot block the successor.
        run: |
          TIMEOUT_BIN="$(command -v gtimeout || command -v timeout)"
          rc=1
          for attempt in 1 2 3; do
            echo "--- test attempt $attempt of 3"
            if [ -n "$TIMEOUT_BIN" ]; then
              if "$TIMEOUT_BIN" -k 10s 240s make test TEST_FLAGS=--test-force-exit PRETTIER="$PWD/node_modules/.bin/prettier" ESLINT="$PWD/node_modules/.bin/eslint"; then
                rc=0
                break
              fi
            else
              if make test TEST_FLAGS=--test-force-exit PRETTIER="$PWD/node_modules/.bin/prettier" ESLINT="$PWD/node_modules/.bin/eslint"; then
                rc=0
                break
              fi
            fi
            echo "--- attempt $attempt failed or timed out; retrying"
          done
          exit "$rc"

  make-test-matrix:
    runs-on: ubuntu-latest
    needs: make-test
    if: always()
    steps:
      - name: Check matrix status
        run: |
          if [ "${{ needs.make-test.result }}" != "success" ]; then
            echo "Some matrix test branches failed or were cancelled"
            exit 1
          fi
          echo "All matrix text branches completed successfully"
