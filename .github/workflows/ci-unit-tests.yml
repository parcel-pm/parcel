name: CI Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  make-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run tests
        # Retry wrapper: the macOS 26 runner occasionally wedges one of the
        # spawned host processes mid-suite (see actions/runner-images#13882),
        # hanging the run until timeout-minutes fires. Each attempt runs the
        # full suite with a 4-minute ceiling; a fresh attempt gets a fresh
        # process tree, so a wedged attempt cannot block the successor.
        run: |
          rc=1
          for attempt in 1 2 3; do
            echo "--- test attempt $attempt of 3"
            # Monitor mode puts make in its own process group so the step
            # watchdog can kill the whole tree (make, node, test-spawned
            # hosts) with a group signal on timeout.
            set -m
            make test TEST_FLAGS=--test-force-exit PRETTIER="$PWD/node_modules/.bin/prettier" ESLINT="$PWD/node_modules/.bin/eslint" &
            TESTPID=$!
            ( sleep 240; kill -TERM -"$TESTPID" 2>/dev/null; sleep 10; kill -KILL -"$TESTPID" 2>/dev/null ) &
            WATCHDOG=$!
            set +m
            if wait "$TESTPID"; then
              rc=0
              kill -- -"$WATCHDOG" 2>/dev/null || true
              wait "$WATCHDOG" 2>/dev/null || true
              break
            fi
            kill -- -"$WATCHDOG" 2>/dev/null || true
            wait "$WATCHDOG" 2>/dev/null || true
            echo "--- attempt $attempt failed or timed out; retrying"
          done
          exit "$rc"

  make-test-matrix:
    runs-on: ubuntu-latest
    needs: make-test
    if: always()
    steps:
      - name: Check matrix status
        run: |
          if [ "${{ needs.make-test.result }}" != "success" ]; then
            echo "Some matrix test branches failed or were cancelled"
            exit 1
          fi
          echo "All matrix text branches completed successfully"
