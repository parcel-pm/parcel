name: CI Unit Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  make-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run tests
        run: make test TEST_FLAGS=--test-force-exit PRETTIER="$PWD/node_modules/.bin/prettier" ESLINT="$PWD/node_modules/.bin/eslint"

  make-test-matrix:
    runs-on: ubuntu-latest
    needs: make-test
    if: always()
    steps:
      - name: Check matric status
        run: |
          if [ "${{ needs.make-test.result }}" != "success" ]; then
            echo "Some matrix test branches failed or were cancelled"
            exit 1
          fi
          echo "All matrix text branches completed successfully"
