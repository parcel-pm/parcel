# gitleaks configuration for Parcel.
# `[extend] useDefault = true` loads gitleaks' built-in default rules; without
# it, a custom config replaces the defaults entirely (which would silently
# disable all secret detection). The allowlist below then excludes vendored
# upstream content that we do not own and do not want to scan.
title = "Parcel gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore vendored/submodule content and generated build outputs"
paths = [
  '''src/publicsuffix/.*''',
  '''node_modules/.*''',
  '''chrome/.*''',
  '''firefox/.*''',
  '''dist/.*''',
  '''src/dist/.*''',
]
